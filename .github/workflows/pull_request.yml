name: Pull Request
on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # holden:ignore:HLD_CI_017 — JamesWoolfenden/.github is our own repo; @main is an accepted, self-controlled trust root
  pr:
    uses: JamesWoolfenden/.github/.github/workflows/terraform-pr-gcp.yml@main
    with:
      service_account: terraform-gcp-artifact-reposit@pike-477416.iam.gserviceaccount.com
